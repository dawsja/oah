<!doctype html>
<html lang="en" class="phone dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>oah</title>
    <script>
      // The phone follows the system theme (dark until it says otherwise).
      try {
        document.documentElement.classList.toggle("dark", !matchMedia("(prefers-color-scheme: light)").matches);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
