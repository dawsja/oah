[package]
name = "oah-app"
description = "oah — open agent harness, the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "oah"

[[bin]]
name = "oah"
path = "src/main.rs"

[lib]
name = "oah_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
oah-core.workspace = true
oah-agents.workspace = true
oah-git.workspace = true
oah-transport.workspace = true
oah-voice.workspace = true
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# Answering WebView2's microphone prompt for voice (wry's own copy).
webview2-com = "=0.39.1"
