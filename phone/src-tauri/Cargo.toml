[package]
name = "oah-phone"
description = "oah for phones: pair with the oah desktop app and continue its chats on the phone"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "oah_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
oah-remote.workspace = true
oah-voice = { path = "../../crates/oah-voice", default-features = false }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }

# Only 64-bit ARM phones load the large voice model. Other ABIs can still use chat.
[target.'cfg(target_arch = "aarch64")'.dependencies]
oah-voice = { path = "../../crates/oah-voice", default-features = false, features = ["engine"] }
