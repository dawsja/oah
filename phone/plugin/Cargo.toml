[package]
name = "tauri-plugin-oah-phone"
description = "oah for phones: the native iOS side (Swift), reached from the app's Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
# Tauri's plugin build links the Swift package under this name.
links = "tauri-plugin-oah-phone"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dependencies]
serde.workspace = true
tauri = { version = "2.12", default-features = false }
