# A UI test that drives the installed iPhone app in a simulator (see ../workflows/ios.yml). It
# has no app of its own: the app is built by `tauri ios build` and found by its bundle id.
name: OahUITest
options:
  bundleIdPrefix: dev.oah.uitest
  deploymentTarget:
    iOS: "17.0"
targets:
  OahUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.oah.uitest
        SWIFT_VERSION: "5.0"
schemes:
  OahUITests:
    build:
      targets:
        OahUITests: all
    test:
      targets: [OahUITests]
