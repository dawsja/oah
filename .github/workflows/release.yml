# Push a tag like v0.1.0 to build every platform and publish a GitHub release.
# Assets follow the layout scripts/install.sh expects, so you can mirror them to
# Cloudflare (R2 / Pages) at https://oah.dev/download/ unchanged:
#   download/latest.txt
#   download/v<version>/oah-<os>-<arch>.tar.gz(.sha256)
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun scripts/build.ts --all
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/latest.txt
            scripts/install.sh
            scripts/install.ps1
