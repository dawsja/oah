# Push a tag like v0.1.0 (matching package.json) to build every platform,
# publish a GitHub release, and upload it to the R2 bucket behind
# https://dl.oah.dev (scripts/publish-r2.sh):
#   latest.txt   install.sh   install.ps1
#   v<version>/oah-<os>-<arch>.tar.gz(.sha256)
# R2 needs repo secrets CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID;
# without them that step is skipped. Repo variable OAH_R2_BUCKET overrides the
# bucket name (default oah-releases).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun scripts/build.ts --all
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/latest.txt
            scripts/install.sh
            scripts/install.ps1
      - name: Publish to R2 (dl.oah.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAH_R2_BUCKET: ${{ vars.OAH_R2_BUCKET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping the R2 upload"
            exit 0
          fi
          bash scripts/publish-r2.sh
