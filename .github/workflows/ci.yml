name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Square corners only
        run: sh scripts/check-sharp.sh
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Typecheck and build
        working-directory: app
        run: bun run web:build
      - name: Tests
        working-directory: app
        run: bun run test

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        # A slow Ubuntu mirror can stall this: retry, then give up.
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev cmake
      - name: Format
        run: cargo fmt --all --check
      - name: Frontend dist for tauri::generate_context
        shell: bash
        run: mkdir -p app/dist && echo '<!doctype html>' > app/dist/index.html
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
