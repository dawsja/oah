# The oah desktop app (desktop/).
#
#   check    every change to desktop/ or the engine protocol
#   build    installers for Linux and Windows, with
#            signed update artifacts — on a desktop-v* tag, or by hand
#   publish  desktop-v* tags: uploads everything to the R2 bucket behind
#            https://dl.oah.dev (scripts/publish-desktop-r2.sh) — desktop/latest.json
#            is what installed apps poll for background updates — and makes a
#            GitHub release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD if it has one) signs updates;
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID upload to R2 (as for the CLI).
# Windows: AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID (an app registration
# with the Artifact Signing Certificate Profile Signer role on oah/oah-prod) sign
# the app and installer via src-tauri/tauri.windows-sign.conf.json; without them
# the Windows build is unsigned.
name: desktop
on:
  push:
    branches: [main]
    paths: ["desktop/**", "src/serve.ts", "src/ui/store.ts", "src/session.ts", "scripts/*desktop*", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", "src/serve.ts", "src/ui/store.ts", "src/session.ts", "scripts/*desktop*", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: System libraries (WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      - run: bun test test/serve.test.ts
      - working-directory: desktop
        run: bun install --frozen-lockfile
      - working-directory: desktop
        run: bun test scripts
      - name: UI (typecheck + build; the shell embeds it)
        working-directory: desktop
        run: bun run vite:build
      - name: Core tests (paths, sessions, the engine process — including the real engine)
        working-directory: desktop
        run: cargo test -p oah-desktop-core
      - name: The Tauri shell compiles
        working-directory: desktop
        run: cargo check -p oah-desktop
      - run: sh -n scripts/install-desktop.sh && bash -n scripts/publish-desktop-r2.sh

  build:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}
      - name: System libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      - working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Build the bundled engine (the oah CLI for this target)
        working-directory: desktop
        run: bun scripts/engine.ts --target ${{ matrix.target }}
      - name: Windows code signing tool (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          cargo install artifact-signing-cli --version 0.12.0 --locked
          st=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/signtool.exe | sort -V | tail -1)
          echo "SIGNTOOL_PATH=$(cygpath -w "$st")" >> "$GITHUB_ENV"
      - name: Build installers and signed updates
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          config=(--config src-tauri/tauri.bundle.conf.json)
          if [ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_CLIENT_ID" ]; then
            config+=(--config src-tauri/tauri.windows-sign.conf.json)
            echo "Signing Windows binaries with Azure Artifact Signing (oah/oah-prod)"
          fi
          bunx tauri build --target ${{ matrix.target }} "${config[@]}"
      - name: Collect release files
        working-directory: desktop
        run: bun scripts/collect.ts --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: oah-desktop-${{ matrix.target }}
          path: desktop/release/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: oah-desktop-*
          merge-multiple: true
          path: desktop/release
      - name: Manifest (updates + downloads)
        run: bun desktop/scripts/manifest.ts --notes "oah desktop ${GITHUB_REF_NAME#desktop-v}"
      - name: Publish to R2 (dl.oah.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAH_R2_BUCKET: ${{ vars.OAH_R2_BUCKET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping the R2 upload"
            exit 0
          fi
          bash scripts/publish-desktop-r2.sh
      - uses: softprops/action-gh-release@v2
        with:
          name: oah desktop ${{ github.ref_name }}
          files: |
            desktop/release/oah-desktop-*
            desktop/release/latest.json
            scripts/install-desktop.sh
            scripts/install-desktop.ps1
