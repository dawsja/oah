name: iOS

# The iPhone app (phone/, built for iOS). No Mac stands behind this repository, so everything
# that needs Xcode happens here:
#
#   check      on a push that touches the phone app or what it's built from: the app's Rust,
#              iOS-only parts included, and its Swift plugin still compile for iOS.
#   simulator  when asked (Actions → iOS → Run workflow): builds the app for the iPhone
#              simulator, runs it there in its demo, and uploads a screenshot of each screen
#              (.github/scripts/ios-simulator.sh), the keyboard included (a UI test,
#              .github/ios-uitest). That's how the app is looked at without a Mac or an iPhone
#              at hand.
#
# The Xcode project (phone/src-tauri/gen/apple) was made by `tauri ios init` on a runner and is
# committed, like gen/android. Its project.pbxproj comes from project.yml (XcodeGen): after
# editing project.yml, the regenerated project is in the simulator job's artifact, to commit.
on:
  push:
    branches: ["**"]
    paths:
      - "phone/**"
      - "crates/oah-remote/**"
      - "crates/oah-voice/**"
      - "crates/oah-core/**"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-check
      - name: Frontend dist for tauri::generate_context
        run: |
          mkdir -p app/dist-mobile
          echo '<!doctype html>' > app/dist-mobile/mobile.html
      # From phone/, as the app's own build runs it (phone/.cargo/config.toml).
      - name: Clippy, for iOS
        working-directory: phone
        run: cargo clippy -p oah-phone --target aarch64-apple-ios-sim -- -D warnings

  simulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Install
        run: |
          (cd app && bun install --frozen-lockfile)
          (cd phone && bun install --frozen-lockfile)
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Xcode project from project.yml
        working-directory: phone/src-tauri/gen/apple
        run: |
          # Folders the project refers to that git doesn't keep (ignored, or empty).
          mkdir -p Externals assets
          xcodegen generate --spec project.yml
          git status --short .
      - name: Build for the simulator
        working-directory: phone
        # Building is what's wanted here; packaging an IPA for a simulator isn't a thing, so
        # the command's own verdict comes second to whether the app is there (next step).
        run: bun tauri ios build --debug --target aarch64-sim || echo "::warning::tauri ios build exited with $?"
      - name: The app
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -type d -path '*-iphonesimulator/oah.app' | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::no oah.app was built"
            exit 1
          fi
          echo "APP=$app" >> "$GITHUB_ENV"
          du -sh "$app"
          plutil -p "$app/Info.plist"
          echo "--- what the build changed in the committed project"
          git status --short phone/src-tauri/gen/apple
      - name: Run it in the simulator
        run: .github/scripts/ios-simulator.sh "$APP" "$RUNNER_TEMP/oah-ios-screens"
      # Screens that need a finger: a UI test (.github/ios-uitest) taps the composer and saves
      # what the screen shows with the keyboard up. Its pictures matter more than its verdict.
      - name: With the keyboard up
        continue-on-error: true
        working-directory: .github/ios-uitest
        run: |
          xcodegen generate
          out="$RUNNER_TEMP/oah-ios-screens"
          TEST_RUNNER_SHOT_DIR="$out" xcodebuild test -project OahUITest.xcodeproj -scheme OahUITests \
            -destination "platform=iOS Simulator,id=$(cat "$out/udid")" > "$out/uitest.log" 2>&1 && verdict=passed || verdict=failed
          grep -E "Test Case|error:|\*\* TEST|Assertion|failed" "$out/uitest.log" | tail -n 30
          echo "UI test $verdict"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oah-ios-screens
          path: ${{ runner.temp }}/oah-ios-screens
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oah-ios-project
          include-hidden-files: true
          path: |
            phone/src-tauri/gen/apple
            !phone/src-tauri/gen/apple/build
            !phone/src-tauri/gen/apple/Externals
            !phone/src-tauri/gen/apple/assets
          if-no-files-found: warn
