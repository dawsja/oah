[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "android/src-tauri"]

[workspace.package]
version = "0.3.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/dawsja/oah"

[workspace.dependencies]
oah-core = { path = "crates/oah-core" }
oah-transport = { path = "crates/oah-transport" }
oah-agents = { path = "crates/oah-agents" }
oah-git = { path = "crates/oah-git" }
oah-voice = { path = "crates/oah-voice" }
oah-mcp = { path = "crates/oah-mcp" }
oah-remote = { path = "crates/oah-remote" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
